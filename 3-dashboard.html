<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/storageflow.css">
  <title>StorageFlow - Dashboard</title>
</head>
<body>
  <header></header>

  <div class="layout">
    <nav class="sidebar"></nav>

    <main class="content">
      <h2 id="PageTitle"></h2>
      <p id="Overview"></p>
      <img id="DashboardImage" class="page-screenshot" src="" alt="Dashboard screen">
      <div class="note" id="OverviewNote"></div>

      <details>
        <summary><h3 id="HeadingDashboard"></h3></summary>

        <div class="field">
          <div class="field-name" id="LabelColourMode"></div>
          <p id="ColourMode"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelDashLanguageBtn"></div>
          <p id="DashLanguageBtn"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelMySettings"></div>
          <p id="MySettings"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelStorageManagement"></div>
          <p id="StorageManagement"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelReports"></div>
          <p id="Reports"></p>
        </div>
      </details>

      <details>
        <summary><h3 id="HeadingDashboardAdmin"></h3></summary>

        <div class="admin-notice" id="AdminNotice"></div>

        <div class="field">
          <div class="field-name" id="LabelUsersManagement"></div>
          <p id="UsersManagement"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelTools"></div>
          <p id="Tools"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelListsManagement"></div>
          <p id="ListsManagement"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelStatusBar"></div>
          <p id="StatusBar"></p>
        </div>

        <div class="field">
          <div class="field-name" id="LabelExitDash"></div>
          <p id="ExitDash"></p>
        </div>
      </details>
    </main>
  </div>

  <div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

  <script src="js/shared-header.js"></script>
  <script src="js/shared-nav.js"></script>
  <script src="js/storageflow-LibEn.js"></script>
  <script src="js/storageflow-LibFr.js"></script>
  <script src="js/3-dashboard-en.js"></script>
  <script src="js/3-dashboard-fr.js"></script>
  <script src="js/storageflow-script.js"></script>
</body>
</html>
